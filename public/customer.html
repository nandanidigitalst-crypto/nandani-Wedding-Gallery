<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forever Wedding Memories</title><link rel="stylesheet" href="/style.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><header class="topbar"><div><div class="brand">💍 Forever Wedding Memories</div><div class="tagline">Our Wedding Story</div></div></header><main id="app"><section id="gate" class="panel"><h2>🔐 आपका Wedding Album</h2><p class="muted">अगर QR/Link से आए हैं तो album अपने-आप खुलेगा।</p><input id="token" placeholder="Album Link Token"><button class="primary" onclick="openAlbum()">Open Album</button></section><section id="album" class="hidden"><section class="cover"><div id="coverPhoto" class="cover-photo">💍</div><div class="cover-text"><span class="pill">Forever Wedding Memories</span><h1 id="names"></h1><p id="date"></p><h3>Our Wedding Story</h3><p id="story"></p></div></section><nav id="tabs" class="album-nav"></nav><section id="content" class="panel"></section></section></main><script>
let wedding=null,files=[];const $=x=>document.getElementById(x),token=new URLSearchParams(location.search).get('token')||'';$('token').value=token;async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cat(name){const p=String(name).split('__')[0];return p||'OTHER'}const sections=[['INVITATION','🌸 Wedding Invitation'],['PREWEDDING','📸 Pre-Wedding Photos'],['ENGAGEMENT','💍 Engagement'],['HALDI','🥁 Haldi'],['MEHNDI','🎨 Mehndi'],['SANGEET','🕺 Sangeet'],['BRIDE','👰 Bride Gallery'],['GROOM','🤵 Groom Gallery'],['CEREMONY','💒 Wedding Ceremony'],['JAIMALA','❤️ Jaimala & Pheras'],['FAMILY','👨‍👩‍👧 Family & Friends'],['HIGHLIGHTS','🎬 Wedding Highlights Video']];async function openAlbum(){try{const t=$('token').value.trim();wedding=await api('/api/customer/session?token='+encodeURIComponent(t));files=await api('/api/weddings/'+wedding.id+'/files?token='+encodeURIComponent(t));$('gate').classList.add('hidden');$('album').classList.remove('hidden');render()}catch(e){alert(e.message)}}function render(){ $('names').textContent=wedding.name;$('date').textContent=wedding.date?'📅 '+wedding.date:'';$('story').textContent=wedding.invitation||'दो दिल, एक कहानी और जीवनभर की खूबसूरत यादें ❤️';$('tabs').innerHTML=sections.map(x=>`<button onclick="show('${x[0]}')">${x[1]}</button>`).join('')+'<button onclick="show(\'CONTACT\')">📞 Contact Photographer</button>';const cover=files.find(f=>cat(f.name)==='COVER');if(cover)$('coverPhoto').innerHTML=`<img src="${cover.url}?token=${encodeURIComponent(token)}">`;show('INVITATION')}function show(c){let arr=files.filter(f=>cat(f.name)===c);if(c==='INVITATION'&&!arr.length)arr=[];let html=c==='INVITATION'?`<h2>🌸 Wedding Invitation</h2><p>${esc(wedding.invitation||'आपका स्वागत है हमारे Forever Wedding Memories में।')}</p>`:c==='CONTACT'?`<h2>📞 Contact Photographer</h2><p>यह album Nandani Video Mixing Lab द्वारा तैयार किया गया है।</p><a class="primary" href="tel:9631742755">📞 Call Photographer</a>`:c==='HIGHLIGHTS'?`<h2>🎬 Wedding Highlights Video</h2>`:`<h2>${(sections.find(x=>x[0]===c)||['',c])[1]}</h2>`;if(arr.length)html+=`<div class="media-grid">${arr.map(f=>{const u=f.url+'?token='+encodeURIComponent(token);return f.mime.startsWith('video/')?`<article class="media-card"><video controls playsinline src="${u}"></video><div class="media-info"><b>${esc(f.name)}</b>${wedding.downloadEnabled?`<a href="${u}&download=1" download>⬇️ Download</a>`:''}</div></article>`:`<article class="media-card"><img loading="lazy" src="${u}" alt=""><div class="media-info"><b>${esc(f.name)}</b>${wedding.downloadEnabled?`<a href="${u}&download=1" download>⬇️ Download</a>`:''}</div></article>`}).join('')}</div>`;else if(c!=='INVITATION'&&c!=='CONTACT')html+='<p class="muted">इस section में अभी photos/videos upload नहीं किए गए हैं।</p>';$('content').innerHTML=html}if(token)openAlbum();</script><style>.cover{min-height:75vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;padding:24px;background:linear-gradient(135deg,#fff,#fff1f6);border-radius:22px}.cover-photo{min-height:430px;border-radius:22px;display:grid;place-items:center;background:#f7e5ec;overflow:hidden;font-size:80px}.cover-photo img{width:100%;height:100%;object-fit:cover}.cover-text h1{font-size:48px;margin:15px 0}.album-nav{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:75px;background:#fff7f2;z-index:4}.album-nav button{white-space:nowrap;border:1px solid #eadfd8;background:#fff;padding:10px 13px;border-radius:99px;cursor:pointer}@media(max-width:700px){.cover{grid-template-columns:1fr;min-height:auto}.cover-photo{min-height:330px}.cover-text h1{font-size:34px}.album-nav{top:65px}}</style></body></html>
