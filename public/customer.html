<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandani Customer Gallery</title><link rel="stylesheet" href="/style.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><header class="topbar"><div><div class="brand">💍 Nandani Wedding Gallery</div><div class="tagline">आपकी शादी की यादें — सुरक्षित online gallery</div></div><a class="ghost" href="/">Home</a></header><main><section id="login" class="panel"><h2>🔑 Customer Login</h2><p class="muted">Admin से मिला Wedding ID और Access Code डालें.</p><input id="wid" placeholder="Wedding ID"><input id="code" placeholder="Access Code"><button class="primary" onclick="login()">Open My Gallery</button></section><section id="gallery" class="hidden"><section class="panel"><div class="panel-title"><div><span class="pill">Customer Portal</span><h2 id="title"></h2><div id="customer" class="muted"></div></div><div><span id="status"></span><button id="pay" class="primary" onclick="pay()">💳 Pay Now</button></div></div><p id="price"></p></section><section class="panel"><div class="panel-title"><h2>📸 Photos & Videos</h2></div><div id="files" class="media-grid"></div></section></section></main><script>
let wedding=null;const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);$('wid').value=qs.get('weddingId')||'';$('code').value=qs.get('accessCode')||'';async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{wedding=await api('/api/customer/session?weddingId='+encodeURIComponent($('wid').value)+'&accessCode='+encodeURIComponent($('code').value));$('login').classList.add('hidden');$('gallery').classList.remove('hidden');render()}catch(e){alert(e.message)}}function render(){ $('title').textContent=wedding.name;$('customer').textContent=wedding.customerName?`Customer: ${wedding.customerName}`:'';$('price').innerHTML=`Package: <b>₹${wedding.price||0}</b>`;$('status').innerHTML=wedding.paid?'<span class="pill">✅ Payment Successful</span>':'<span class="pill">🔒 Payment Required</span>';$('pay').style.display=wedding.paid||Number(wedding.price)<=0?'none':'inline-block';loadFiles()}async function loadFiles(){const f=await api('/api/weddings/'+wedding.id+'/files');$('files').innerHTML=f.length?f.map(x=>x.mime.startsWith('video/')?`<article class="media-card"><video controls preload="metadata" src="${x.url}"></video><div class="media-info"><b>${esc(x.name)}</b><div class="muted">${fmt(x.size)}</div>${wedding.paid?`<a href="${x.url}" download>⬇️ Download</a>`:''}</div></article>`:`<article class="media-card"><img loading="lazy" src="${x.url}" alt="${esc(x.name)}"><div class="media-info"><b>${esc(x.name)}</b><div class="muted">${fmt(x.size)}</div>${wedding.paid?`<a href="${x.url}" download>⬇️ Download</a>`:''}</div></article>`).join(''):'<p class="muted">Gallery अभी खाली है.</p>'}async function pay(){try{const o=await api('/api/payments/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weddingId:wedding.id,accessCode:wedding.accessCode})});if(o.paid){wedding.paid=true;render();return}const r=new Razorpay({key:o.keyId,amount:o.amount,currency:o.currency,name:'Nandani Video Mixing Lab',description:wedding.name,prefill:{name:wedding.customerName||'',email:wedding.customerEmail||'',contact:wedding.customerPhone||''},order_id:o.orderId,theme:{color:'#111827'},handler:async response=>{try{await api('/api/payments/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...response,weddingId:wedding.id,accessCode:wedding.accessCode})});wedding.paid=true;alert('Payment successful ✅');render()}catch(e){alert(e.message)}}});r.open()}catch(e){alert(e.message)}}function fmt(b){if(!b)return'0 B';const u=['B','KB','MB','GB','TB'],i=Math.floor(Math.log(b)/Math.log(1024));return`${(b/Math.pow(1024,i)).toFixed(i?1:0)} ${u[i]}`}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if($('wid').value&&$('code').value)login();</script></body></html>
