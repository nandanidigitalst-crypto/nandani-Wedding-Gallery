<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandani Admin Panel</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div><div class="brand">🎬 Nandani Admin Panel</div><div class="tagline">Wedding albums, customers, uploads & payments</div></div><a class="ghost" href="/">Customer Website</a></header><main><section id="login" class="panel"><h2>🔐 Admin Login</h2><input id="password" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button><p class="muted">Production में ADMIN_PASSWORD environment variable बदलें.</p></section><section id="app" class="hidden"><section class="panel"><div class="panel-title"><h2>➕ नया Wedding Customer</h2></div><div class="hero-card"><input id="name" placeholder="Wedding name"><input id="customerName" placeholder="Customer name"><input id="customerPhone" placeholder="Mobile"><input id="customerEmail" placeholder="Email"><input id="price" type="number" min="0" placeholder="Package price ₹"><button class="primary" onclick="createWedding()">Create Wedding</button></div></section><section class="panel"><div class="panel-title"><h2>💍 Wedding Accounts</h2><button class="ghost" onclick="load()">Refresh</button></div><div id="list" class="wedding-grid"></div></section></section></main><script>
let token="";const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}async function login(){try{token=(await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})})).token;sessionStorage.adminToken=token;$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}catch(e){alert(e.message)}}async function load(){const a=await api('/api/admin/weddings',{headers:{Authorization:'Bearer '+token}});$('list').innerHTML=a.length?a.map(w=>`<article class="wedding"><div class="icon">💍</div><h3>${esc(w.name)}</h3><div>Customer: ${esc(w.customerName||'-')}</div><div>Mobile: ${esc(w.customerPhone||'-')}</div><div>Price: ₹${w.price||0} · ${w.paid?'✅ Paid':'⏳ Unpaid'}</div><div class="muted">Customer Access ID: <b>${w.id}</b></div><div class="muted">Access Code: <b>${w.accessCode}</b></div><p><a class="primary" href="/customer.html?weddingId=${encodeURIComponent(w.id)}&accessCode=${encodeURIComponent(w.accessCode)}" target="_blank">Customer Panel ↗</a></p><label class="upload-btn">📤 Upload<input type="file" multiple accept="image/*,video/*" hidden onchange="upload('${w.id}',this.files)"></label><div id="u-${w.id}"></div><div class="actions"><button onclick="del('${w.id}')">🗑️ Delete Wedding</button></div></article>`).join(''):'<p class="muted">No weddings yet.</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function createWedding(){try{await api('/api/admin/weddings',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name:$('name').value,customerName:$('customerName').value,customerPhone:$('customerPhone').value,customerEmail:$('customerEmail').value,price:$('price').value})});['name','customerName','customerPhone','customerEmail','price'].forEach(x=>$(x).value='');load()}catch(e){alert(e.message)}}async function upload(wid,files){for(const f of files){const row=document.createElement('div');row.textContent='Uploading '+f.name;$('u-'+wid).append(row);try{const s=await api('/api/upload/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weddingId:wid,fileName:f.name,size:f.size,mime:f.type})});let o=0;while(o<f.size){const b=f.slice(o,Math.min(o+s.chunkBytes,f.size)),fd=new FormData();fd.append('chunk',b,'chunk');const r=await fetch('/api/upload/'+s.uploadId+'/chunk',{method:'POST',headers:{'X-Chunk-Start':String(o)},body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);o=d.received;row.textContent=`${f.name}: ${Math.round(o/f.size*100)}%`}await api('/api/upload/'+s.uploadId+'/finish',{method:'POST'});row.textContent='✅ '+f.name}catch(e){row.textContent='❌ '+f.name+': '+e.message}}}async function del(id){if(!confirm('Delete wedding and its record?'))return;try{await api('/api/admin/weddings/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}catch(e){alert(e.message)}}(()=>{token=sessionStorage.adminToken||'';if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}})();</script></body></html>
