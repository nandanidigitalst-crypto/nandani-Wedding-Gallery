<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forever Wedding Memories — Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div><div class="brand">💍 Forever Wedding Memories</div><div class="tagline">Admin Control Panel — customers, albums, QR, uploads & payments</div></div><a class="ghost" href="/">Website</a></header><main><section id="login" class="panel"><h2>🔐 Admin Login</h2><input id="password" type="password" placeholder="ADMIN_PASSWORD"><button class="primary" onclick="login()">Login</button></section><section id="app" class="hidden"><section class="panel"><div class="panel-title"><h2>➕ नया Customer Album</h2></div><div class="hero-card"><input id="name" placeholder="Rahul ❤️ Priya Wedding"><input id="customerName" placeholder="Customer name"><input id="customerPhone" placeholder="Mobile"><input id="customerEmail" placeholder="Email"><input id="date" type="date"><input id="price" type="number" min="0" placeholder="Package price ₹"><select id="downloadEnabled"><option value="true">📥 Photos Download ON</option><option value="false">🔒 Photos Download OFF</option></select><textarea id="invitation" placeholder="Wedding Invitation / Our Wedding Story"></textarea><button class="primary" onclick="createWedding()">Create Album</button></div></section><section class="panel"><div class="panel-title"><h2>💍 All Customer Albums</h2><button class="ghost" onclick="load()">Refresh</button></div><div id="list" class="wedding-grid"></div></section></section></main><script>
let token=sessionStorage.adminToken||'';const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function login(){try{token=(await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})})).token;sessionStorage.adminToken=token;showApp();load()}catch(e){alert(e.message)}}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}async function createWedding(){try{const w=await api('/api/admin/weddings',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name:$('name').value,customerName:$('customerName').value,customerPhone:$('customerPhone').value,customerEmail:$('customerEmail').value,date:$('date').value,price:$('price').value,downloadEnabled:$('downloadEnabled').value==='true',invitation:$('invitation').value})});['name','customerName','customerPhone','customerEmail','date','price','invitation'].forEach(x=>$(x).value='');load();alert('Album created. Wedding ID: '+w.id)}catch(e){alert(e.message)}}async function load(){try{const a=await api('/api/admin/weddings',{headers:{Authorization:'Bearer '+token}});$('list').innerHTML=a.length?a.map(w=>{const link=location.origin+'/customer.html?token='+encodeURIComponent(w.publicToken);return `<article class="wedding"><div class="icon">💍</div><h3>${esc(w.name)}</h3><div>👤 ${esc(w.customerName)}</div><div>📅 ${esc(w.date||'Date not set')}</div><div>💰 ₹${w.price||0} · ${w.paid?'✅ Paid':'⏳ Unpaid'}</div><div>📥 Download: ${w.downloadEnabled?'ON':'OFF'}</div><div class="muted">Wedding ID: <b>${esc(w.id)}</b></div><div class="muted">Access Code: <b>${esc(w.accessCode)}</b></div><div class="actions"><button onclick="showQR('${w.publicToken}','${esc(w.name).replace(/'/g,'')}')">📱 QR Code</button><a href="${link}" target="_blank">Open Album ↗</a></div><div class="upload-tools"><select id="cat-${w.id}"><option value="PREWEDDING">📸 Pre-Wedding</option><option value="ENGAGEMENT">💍 Engagement</option><option value="HALDI">🥁 Haldi</option><option value="MEHNDI">🎨 Mehndi</option><option value="SANGEET">🕺 Sangeet</option><option value="BRIDE">👰 Bride Gallery</option><option value="GROOM">🤵 Groom Gallery</option><option value="CEREMONY">💒 Wedding Ceremony</option><option value="JAIMALA">❤️ Jaimala & Pheras</option><option value="FAMILY">👨‍👩‍👧 Family & Friends</option><option value="HIGHLIGHTS">🎬 Wedding Highlights Video</option><option value="COVER">🖼️ Cover Photo</option><option value="INVITATION">🌸 Invitation</option></select><label class="upload-btn">📤 Upload<input type="file" multiple accept="image/*,video/*" hidden onchange="upload('${w.id}',this.files)"></label></div><div id="u-${w.id}"></div><div class="actions"><button onclick="edit('${w.id}',${JSON.stringify(w).replace(/</g,'\\u003c')})">✏️ Edit</button><button onclick="del('${w.id}')">🗑️ Delete</button></div></article>`}).join(''):'<p class="muted">No customer albums yet.</p>'}catch(e){if(e.message.includes('Admin')){$('login').classList.remove('hidden');$('app').classList.add('hidden')}}}async function upload(wid,files){const cat=$('cat-'+wid).value;for(const f of files){const name=cat+'__'+f.name;const row=document.createElement('div');row.className='upload-row';row.textContent='Uploading '+f.name;$('u-'+wid).prepend(row);try{const s=await api('/api/upload/start',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({weddingId:wid,fileName:name,size:f.size,mime:f.type})});let o=0;while(o<f.size){const b=f.slice(o,Math.min(o+s.chunkBytes,f.size)),fd=new FormData();fd.append('chunk',b,'chunk');const r=await fetch('/api/upload/'+s.uploadId+'/chunk',{method:'POST',headers:{'X-Chunk-Start':String(o),Authorization:'Bearer '+token},body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);o=d.received;row.textContent=`${f.name}: ${Math.round(o/f.size*100)}%`}await api('/api/upload/'+s.uploadId+'/finish',{method:'POST',headers:{Authorization:'Bearer '+token}});row.textContent='✅ '+f.name}catch(e){row.textContent='❌ '+f.name+': '+e.message}}}async function edit(id,w){const name=prompt('Wedding name',w.name);if(name===null)return;const date=prompt('Wedding date YYYY-MM-DD',w.date||'');const download=confirm('Photos download ON? OK=ON, Cancel=OFF');try{await api('/api/admin/weddings/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({name,date,downloadEnabled:download})});load()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete this album and customer record?'))return;try{await api('/api/admin/weddings/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}catch(e){alert(e.message)}}function showQR(token,name){const url=location.origin+'/customer.html?token='+encodeURIComponent(token);const w=window.open('','qr','width=420,height=560');w.document.write(`<html><head><title>Wedding QR</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script></head><body style="font-family:system-ui;text-align:center;padding:25px"><h2>💍 ${esc(name)}</h2><div id="qr"></div><p>${esc(url)}</p><script>new QRCode(document.getElementById('qr'),{text:${JSON.stringify(url)},width:280,height:280});<\/script></body></html>`)}if(token){showApp();load()}
</script></body></html>
